<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EEF8FE"/>
      <stop offset="100%" style="stop-color:#FDFBF7"/>
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F5F0E8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Book cover -->
  <rect x="110" y="130" width="292" height="280" rx="16" fill="#3B82F6" opacity="0.9"/>
  <!-- Book pages -->
  <rect x="130" y="145" width="260" height="250" rx="8" fill="url(#book)"/>
  <!-- Book spine -->
  <rect x="130" y="145" width="12" height="250" fill="#2563EB" opacity="0.3"/>
  <!-- Lines on page -->
  <line x1="165" y1="195" x2="365" y2="195" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="235" x2="345" y2="235" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="275" x2="355" y2="275" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="315" x2="300" y2="315" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="355" x2="330" y2="355" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round"/>
  <!-- Pen -->
  <g transform="translate(340, 90) rotate(30)">
    <rect x="0" y="0" width="16" height="140" rx="4" fill="#F59E0B"/>
    <polygon points="0,140 16,140 8,165" fill="#78350F"/>
    <rect x="0" y="0" width="16" height="20" rx="4" fill="#FBBF24"/>
  </g>
  <!-- Bookmark -->
  <polygon points="370,130 400,130 400,180 385,165 370,180" fill="#EF4444"/>
</svg>
